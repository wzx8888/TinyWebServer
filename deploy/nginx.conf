# TinyWebServer 的反向代理配置：在这里终止 TLS。
#
# 为什么 TLS 放在代理而不是 C++ 服务里：
#   1. 服务本身的四个 socket 调用点（LT/ET 两处 recv、close 前的排空 recv、
#      发送用的 writev）都要换成 SSL_read/SSL_write，还要处理非阻塞握手、
#      SSL_ERROR_WANT_READ/WANT_WRITE、以及 writev 没有 TLS 对应物这件事。
#      这些逻辑闯进的是每个请求都要走的路径，风险与收益不成比例。
#   2. 证书轮换、TLS 版本与密码套件策略、OCSP stapling、HTTP/2 —— 这些都会变，
#      放在代理里改一行配置就够了，改在 C++ 里就是一次重新编译和发布。
#   3. 代理还能顺手做限速、超时、访问日志，这些服务本身都不必自己实现。
#
# 这套配置【可以用普通用户跑】，不需要 sudo、不碰 /etc/nginx：
#   ./deploy/gen-cert.sh
#   mkdir -p deploy/logs deploy/temp
#   nginx -c "$PWD/deploy/nginx.conf" -p "$PWD/deploy/"
#   curl -k https://127.0.0.1:8443/judge.html
# 关掉：
#   nginx -c "$PWD/deploy/nginx.conf" -p "$PWD/deploy/" -s quit
#
# 上生产要改的三处（都写在文末注释里）：监听 443、用 CA 证书、装成 systemd 服务。

worker_processes 1;

# 所有路径都相对 -p 指定的前缀，这样整份配置是自包含的。
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 不做静态文件服务，只需要一个兜底的 Content-Type。
    default_type application/octet-stream;

    # 四个临时目录必须在 http 上下文里显式指定：不指定的话 nginx 会去用
    # 编译期默认的 /var/lib/nginx/... ，那个目录普通用户没有写权限，
    # 启动时会报 "mkdir() failed (13: Permission denied)"。
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    access_log logs/access.log;

    server {
        # 非特权端口，方便用普通用户测试。生产见文末。
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     tls/server.crt;
        ssl_certificate_key tls/server.key;

        # 关掉 TLSv1.0/1.1：它们已被各大浏览器淘汰，且存在已知弱点。
        # 现代客户端都支持 1.2+，关掉不损失可用性。
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 5m;

        # 与后端的 MAX_CONTENT_LENGTH(49152) 对齐，留一点余量。
        # 不设的话默认是 1m：48KB~1MB 的请求会先整个传到代理的临时文件里，
        # 再被后端回一个 413，白费一遍带宽和磁盘。
        client_max_body_size 64k;

        location / {
            proxy_pass http://127.0.0.1:9006;
            proxy_http_version 1.1;

            # 【这一行是整份配置里最容易出错的地方】
            # 必须用 $http_host，不能用 $host。
            #   $http_host = 客户端发来的 Host 头原样，含端口
            #   $host      = 去掉端口的服务器名
            # 后端的 CSRF 防护（http_conn::origin_ok）拿 Origin 和 Host 比对
            # 时是忽略 scheme、但【保留端口】的。浏览器发
            #   Origin: https://example.com:8443
            # 而 $host 会把 Host 变成 example.com —— 端口被吃掉，两者不相等，
            # 于是【所有写操作都返回 403】，而且看起来像是 CSRF 防护太严，
            # 排查方向很容易被带偏。
            proxy_set_header Host $http_host;

            # Origin 默认就会原样透传，显式写出来是为了标记"它不能被改"：
            # 一旦有别的配置（比如某个安全加固模板）把 Origin 抹掉，
            # 后端的 CSRF 检查会因为"没有 Origin = 非浏览器客户端"而直接放行，
            # 那等于把这道防线拆了。
            proxy_set_header Origin $http_origin;

            # 后端目前不读这两个头（日志里记的是 TCP 对端地址），
            # 传过去是为了以后要在日志里还原真实客户端 IP 时不用再改代理。
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 后端可能故意慢（比如 bcrypt 校验约 60ms），超时给足。
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}

# ---------------------------------------------------------------------------
# 生产环境要改的地方
# ---------------------------------------------------------------------------
# 1) 监听特权端口（需要 root 或 setcap，所以 nginx 主进程要以 root 起、
#    worker 降权到非特权用户）：
#       listen 443 ssl;
#       user www-data;
#    并删掉上面的 pid/error_log 相对路径，改用 /var/log/nginx/。
#
# 2) 用 CA 签发的证书，并启用 HSTS（确认全站都能走 HTTPS 再加，
#    加错了会让用户在一段时间内完全打不开）：
#       ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#       add_header Strict-Transport-Security "max-age=31536000" always;
#
# 3) 后端必须【继续】只监听 127.0.0.1。
#    如果为了图方便改成 0.0.0.0，那么同一网络里任何人都可以
#    http://内网IP:9006 直连后端，绕过 TLS、绕过代理上的所有策略，
#    而且他自己浏览器里的会话 Cookie（SameSite=Lax，非 Secure）
#    会照样带上去 —— 整套部署方式的前提就没了。
